<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesador de Pólizas · Formato CAD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%233b82f6' d='M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5z'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-effect"></div>

  <div class="container">
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="44" height="44"><path fill="currentColor" d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5zM8 13h8v1.6H8zm0 3.4h8V18H8z"/></svg>
      </div>
      <h1>Procesador de Pólizas</h1>
      <p>Genera el Formato CAD y prepara el correo en Outlook a partir de la carpeta de la póliza.</p>
    </header>

    <section class="settings" aria-label="Datos del funcionario">
      <label class="field">
        <span>Nombre del funcionario (firma del CAD) <b class="req">*</b></span>
        <input id="nombre" type="text" autocomplete="name" placeholder="Ej: GABRIEL MEJIA LOPEZ">
      </label>
      <label class="field">
        <span>Enviar correo a (opcional)</span>
        <input id="para" type="text" autocomplete="email" placeholder="correo@ejemplo.com; otro@ejemplo.com">
      </label>
    </section>

    <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="Arrastra o selecciona la carpeta de la póliza">
      <div class="drop-zone-content">
        <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6a2 2 0 0 1 2-2h4.6l2 2H19a2 2 0 0 1 2 2v1H7.4a2 2 0 0 0-1.9 1.4L3 18.2V6zm2.4 5.1A1 1 0 0 1 6.4 10.5H21.6a1 1 0 0 1 1 1.3l-2.2 7A2 2 0 0 1 18.5 20H4.2a.7.7 0 0 1-.7-.9z"/></svg>
        <div>
          <h2>Arrastra aquí la carpeta de la póliza</h2>
          <p>o <span class="link">haz clic para seleccionarla</span>. Puedes soltar varias carpetas a la vez.</p>
        </div>
      </div>
      <input id="folder-input" type="file" webkitdirectory directory multiple hidden>
    </div>

    <div id="results" class="results"></div>

    <footer>
      <p>Los archivos se procesan en tu navegador: no se suben a ningún servidor.</p>
    </footer>
  </div>

  <template id="card-tpl">
    <article class="card">
      <div class="card-head">
        <div class="card-title">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6a2 2 0 0 1 2-2h4.6l2 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="folder-name"></span>
        </div>
        <span class="badge">Leyendo…</span>
      </div>
      <div class="card-body hidden">
        <div class="grid">
          <label class="field"><span>N° póliza</span><input data-k="poliza" inputmode="numeric"></label>
          <label class="field"><span>Certificado</span><input data-k="certificado" inputmode="numeric"></label>
          <label class="field wide"><span>Ramo</span><input data-k="ramo"></label>
          <label class="field"><span>Folios</span><input data-k="folios" type="number" min="1"></label>
          <label class="field"><span>Tipo de trámite (PD / SD)</span>
            <select data-k="tipo"><option value="PD" title="Primer documento">PD</option><option value="SD" title="Segundo documento">SD</option></select>
          </label>
        </div>
        <details class="files">
          <summary></summary>
          <ul></ul>
        </details>
        <div class="mail-preview">
          <div><b>Asunto:</b> <span class="subject"></span></div>
          <div class="body"></div>
        </div>
        <p class="warn hidden"></p>
        <div class="actions">
          <button class="btn primary" data-act="cad">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3zM5 18h14v2H5z"/></svg>
            Descargar Formato CAD
          </button>
          <button class="btn outlook" data-act="mail">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4.4 7H4v.9l8 5.5 8-5.5V7h-.4z"/></svg>
            Preparar correo en Outlook
          </button>
          <button class="btn ghost" data-act="copy" title="Copia asunto y cuerpo para pegarlos en Outlook web">Copiar texto</button>
        </div>
      </div>
      <p class="error hidden"></p>
    </article>
  </template>

  <script src="vendor/pdf-lib.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
